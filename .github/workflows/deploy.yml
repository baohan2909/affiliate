name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  # Chạy tay (GitHub → Actions → Deploy GitHub Pages → Run workflow): điền "ban" để quay về một bản đã lưu,
  # vd. ban-on-dinh-21-11-2026; để trống = bản mới nhất trên main.
  workflow_dispatch:
    inputs:
      ban:
        description: 'Bản cần chạy (vd. ban-on-dinh-21-11-2026). Để trống = bản mới nhất'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ban || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Tên miền riêng affiliate.nonson.vn → chạy ở gốc "/"
          VITE_BASE: /
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
